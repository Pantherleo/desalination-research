name: Research integrity checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python python_scripts/audit_research.py
      - run: python -m unittest discover -s python_scripts -p "test_*.py" -v
